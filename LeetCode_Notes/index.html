<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeetCode Study Notes</title>
<link id="hl-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<link id="hl-dark" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" disabled>
<style>
:root {
  --bg: #f7f7f5;
  --surface: #ffffff;
  --surface-2: #f0efec;
  --border: #e2e0db;
  --text: #1f2328;
  --muted: #646a73;
  --accent: #2f6fde;
  --accent-soft: #e6eefc;
  --good: #1f8a4c;
  --good-soft: #e3f4ea;
  --warn: #9a6700;
  --warn-soft: #fff4d6;
  --code-bg: #f6f8fa;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
  --sidebar-w: 300px;
  --toc-w: 230px;
  --header-h: 56px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --surface: #161a20; --surface-2: #1d222a; --border: #2a3039;
    --text: #e6e8eb; --muted: #9aa3ad; --accent: #6ea2ff; --accent-soft: #1b2a45;
    --good: #4cc38a; --good-soft: #15301f; --warn: #e3b341; --warn-soft: #33290f;
    --code-bg: #0d1117; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --surface: #161a20; --surface-2: #1d222a; --border: #2a3039;
  --text: #e6e8eb; --muted: #9aa3ad; --accent: #6ea2ff; --accent-soft: #1b2a45;
  --good: #4cc38a; --good-soft: #15301f; --warn: #e3b341; --warn-soft: #33290f;
  --code-bg: #0d1117; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--header-h) + 16px); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }

/* Header */
header {
  position: sticky; top: 0; z-index: 30; height: var(--header-h);
  display: flex; align-items: center; gap: 12px; padding: 0 16px;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
}
.brand { font-weight: 700; font-size: 17px; color: var(--text); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.brand:hover { text-decoration: none; }
.brand .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 14px; }
.header-progress { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
.bar { width: 120px; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--good); border-radius: 99px; transition: width .3s; }
.icon-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; height: 36px; min-width: 36px; padding: 0 10px; cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); }
#menu-btn { display: none; }

/* Layout */
.layout { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }
aside.sidebar {
  position: sticky; top: var(--header-h); height: calc(100vh - var(--header-h));
  overflow-y: auto; border-right: 1px solid var(--border); background: var(--surface); padding: 14px 12px 40px;
}
.search { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; }
.search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.filters { display: flex; gap: 6px; margin: 10px 0 6px; }
.chip { font-size: 12px; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--border); background: var(--bg); cursor: pointer; color: var(--muted); }
.chip.active { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
.topic { margin-top: 14px; }
.topic-title { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 4px 8px; display: flex; justify-content: space-between; }
.problem-link {
  display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px;
  color: var(--text); font-size: 14px; line-height: 1.35;
}
.problem-link:hover { background: var(--surface-2); text-decoration: none; }
.problem-link.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.problem-link .num { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; min-width: 26px; }
.problem-link .dot { margin-left: auto; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--border); flex: none; display: grid; place-items: center; font-size: 10px; }
.problem-link .dot.done { background: var(--good); border-color: var(--good); color: #fff; }
.empty-search { color: var(--muted); font-size: 14px; padding: 12px 8px; }

main { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) var(--toc-w); }
.content { padding: 32px 40px 80px; max-width: 900px; width: 100%; margin: 0 auto; min-width: 0; }
nav.toc { position: sticky; top: var(--header-h); height: calc(100vh - var(--header-h)); overflow-y: auto; padding: 32px 16px; font-size: 13px; }
nav.toc .toc-title { font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-size: 11px; margin-bottom: 8px; }
nav.toc a { display: block; padding: 4px 8px; color: var(--muted); border-left: 2px solid var(--border); line-height: 1.35; }
nav.toc a:hover { color: var(--text); text-decoration: none; }
nav.toc a.current { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }

/* Note toolbar */
.note-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 18px; }
.badge { font-size: 12px; padding: 3px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted); font-weight: 600; }
.badge.reviewed { background: var(--good-soft); color: var(--good); }
.badge.premium { background: var(--warn-soft); color: var(--warn); }
.study-toggle { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 600; }
.study-toggle.done { background: var(--good); border-color: var(--good); color: #fff; }

/* Markdown */
.md { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 36px 44px; box-shadow: var(--shadow); }
.md h1 { font-size: 30px; line-height: 1.25; margin: 0 0 20px; }
.md h2 { font-size: 22px; margin: 44px 0 14px; padding-top: 22px; border-top: 1px solid var(--border); }
.md h3 { font-size: 18px; margin: 28px 0 10px; }
.md h4 { font-size: 16px; margin: 20px 0 8px; }
.md hr { display: none; }
.md h2:first-of-type { border-top: none; padding-top: 0; margin-top: 28px; }
.md p, .md li { overflow-wrap: anywhere; }
.md blockquote { margin: 16px 0; padding: 10px 16px; border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; color: var(--text); }
.md blockquote p { margin: 6px 0; }
.md code { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: .88em; background: var(--surface-2); padding: .15em .4em; border-radius: 5px; }
.md pre { position: relative; background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px; padding: 0; overflow: hidden; }
.md pre code { display: block; padding: 16px 18px; overflow-x: auto; background: transparent !important; font-size: 14px; line-height: 1.55; }
.copy-btn { position: absolute; top: 8px; right: 8px; font-size: 12px; padding: 3px 9px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; opacity: 0; transition: opacity .15s; }
.md pre:hover .copy-btn, .copy-btn:focus { opacity: 1; }
.table-wrap { overflow-x: auto; margin: 16px 0; border: 1px solid var(--border); border-radius: 10px; }
.md table { border-collapse: collapse; width: 100%; font-size: 14px; }
.md th, .md td { padding: 8px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
.md th { background: var(--surface-2); font-weight: 600; }
.md tr:last-child td { border-bottom: none; }
.md details { margin: 10px 0 14px; border: 1px dashed var(--border); border-radius: 8px; padding: 8px 14px; background: var(--bg); }
.md summary { cursor: pointer; font-weight: 600; color: var(--accent); }
.md input[type="checkbox"] { margin-right: 6px; accent-color: var(--good); }
.md ul:has(> li > input[type="checkbox"]) { list-style: none; padding-left: 4px; }

.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; }
.pager a { flex: 1; padding: 14px 18px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text); }
.pager a:hover { border-color: var(--accent); text-decoration: none; }
.pager small { display: block; color: var(--muted); font-size: 12px; }
.pager .next { text-align: right; }

/* Home */
.hero { padding: 8px 0 24px; }
.hero h1 { font-size: 34px; margin: 0 0 8px; }
.hero p { color: var(--muted); margin: 0; max-width: 640px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 24px 0; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); }
.stat b { display: block; font-size: 28px; line-height: 1.2; }
.stat span { color: var(--muted); font-size: 13px; }
.cta { display: inline-block; margin-top: 4px; padding: 10px 18px; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; }
.cta:hover { text-decoration: none; filter: brightness(1.05); }
.topics-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-top: 24px; }
.topic-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; color: var(--text); box-shadow: var(--shadow); }
.topic-card:hover { border-color: var(--accent); text-decoration: none; }
.topic-card h3 { margin: 0 0 4px; font-size: 17px; }
.topic-card p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
.topic-card .bar { width: 100%; }
.notice { padding: 16px 18px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); }

/* Responsive */
@media (max-width: 1280px) { main { grid-template-columns: minmax(0, 1fr); } nav.toc { display: none; } }
@media (max-width: 900px) {
  #menu-btn { display: inline-block; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  aside.sidebar { position: fixed; left: 0; top: var(--header-h); width: min(86vw, 320px); z-index: 25; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow); }
  body.menu-open aside.sidebar { transform: none; }
  .content { padding: 20px 16px 60px; }
  .md { padding: 22px 18px; border-radius: 12px; }
  .md h1 { font-size: 24px; }
  .header-progress .bar, .header-progress .label { display: none; }
}
</style>
</head>
<body>
<header>
  <button class="icon-btn" id="menu-btn" aria-label="Open problem list">☰</button>
  <a class="brand" href="#/"><span class="logo">LC</span><span>LeetCode Study Notes</span></a>
  <div class="header-progress">
    <span class="label" id="progress-label"></span>
    <div class="bar" aria-hidden="true"><span id="progress-bar" style="width:0"></span></div>
    <button class="icon-btn" id="theme-btn" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <input class="search" id="search" type="search" placeholder="Search problems… ( / )" autocomplete="off">
    <div class="filters">
      <button class="chip active" data-filter="all">All</button>
      <button class="chip" data-filter="todo">To study</button>
      <button class="chip" data-filter="done">Studied</button>
    </div>
    <div id="problem-list"></div>
  </aside>
  <main>
    <div class="content" id="content"></div>
    <nav class="toc" id="toc" aria-label="On this page"></nav>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(() => {
  const $ = (sel, el = document) => el.querySelector(sel);
  const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
  const store = {
    get(key, fallback) { try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* storage unavailable */ } },
  };

  let problems = [];
  let studied = new Set(store.get("lc-studied", []));
  let filter = "all";
  let currentPath = null;

  const numberOf = p => p.note_file.split("/").pop().slice(0, 3);
  const isPremium = p => /premium/i.test(p.title);
  const cleanTitle = t => t.replace(/\s*\(Leetcode Premium\)/i, "");
  const escapeHtml = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const slug = t => t.trim().toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu, "").replace(/\s/g, "-");

  // ---------- Theme ----------
  function applyTheme(theme) {
    if (theme) document.documentElement.setAttribute("data-theme", theme);
    else document.documentElement.removeAttribute("data-theme");
    const dark = theme ? theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    $("#hl-dark").disabled = !dark;
    $("#hl-light").disabled = dark;
  }
  applyTheme(store.get("lc-theme", null));
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => applyTheme(store.get("lc-theme", null)));
  $("#theme-btn").addEventListener("click", () => {
    const dark = document.documentElement.getAttribute("data-theme") === "dark" ||
      (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    const next = dark ? "light" : "dark";
    store.set("lc-theme", next);
    applyTheme(next);
  });

  // ---------- Sidebar ----------
  function topicsInOrder() {
    const order = [];
    for (const p of problems) if (!order.includes(p.topic)) order.push(p.topic);
    return order;
  }

  function renderSidebar() {
    const q = $("#search").value.trim().toLowerCase();
    const html = [];
    for (const topic of topicsInOrder()) {
      const items = problems.filter(p => p.topic === topic).filter(p => {
        const n = numberOf(p);
        if (filter === "done" && !studied.has(n)) return false;
        if (filter === "todo" && studied.has(n)) return false;
        if (!q) return true;
        return p.title.toLowerCase().includes(q) || n.includes(q) || p.topics.join(" ").toLowerCase().includes(q);
      });
      if (!items.length) continue;
      const total = problems.filter(p => p.topic === topic);
      const done = total.filter(p => studied.has(numberOf(p))).length;
      html.push(`<div class="topic"><div class="topic-title"><span>${escapeHtml(topic)}</span><span>${done}/${total.length}</span></div>`);
      for (const p of items) {
        const n = numberOf(p);
        const active = p.note_file === currentPath ? " active" : "";
        const isDone = studied.has(n);
        html.push(`<a class="problem-link${active}" href="#/${p.note_file}"><span class="num">${n}</span><span>${escapeHtml(cleanTitle(p.title))}</span><span class="dot${isDone ? " done" : ""}" title="${isDone ? "Studied" : "Not studied yet"}">${isDone ? "✓" : ""}</span></a>`);
      }
      html.push(`</div>`);
    }
    $("#problem-list").innerHTML = html.join("") || `<div class="empty-search">No problems match “${escapeHtml(q)}”.</div>`;
    $("#problem-list .problem-link.active")?.scrollIntoView({ block: "nearest" });
  }

  function updateProgress() {
    const done = problems.filter(p => studied.has(numberOf(p))).length;
    $("#progress-label").textContent = `${done} / ${problems.length} studied`;
    $("#progress-bar").style.width = problems.length ? `${(100 * done / problems.length).toFixed(1)}%` : "0";
  }

  function toggleStudied(n) {
    if (studied.has(n)) studied.delete(n); else studied.add(n);
    store.set("lc-studied", [...studied]);
    updateProgress();
    renderSidebar();
  }

  $("#search").addEventListener("input", renderSidebar);
  $$(".chip").forEach(chip => chip.addEventListener("click", () => {
    $$(".chip").forEach(c => c.classList.toggle("active", c === chip));
    filter = chip.dataset.filter;
    renderSidebar();
  }));
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== $("#search")) { e.preventDefault(); document.body.classList.add("menu-open"); $("#search").focus(); }
    if (e.key === "Escape") document.body.classList.remove("menu-open");
  });
  $("#menu-btn").addEventListener("click", () => document.body.classList.toggle("menu-open"));
  $("#problem-list").addEventListener("click", e => { if (e.target.closest("a")) document.body.classList.remove("menu-open"); });

  // ---------- Home ----------
  function showHome() {
    currentPath = null;
    renderSidebar();
    document.title = "LeetCode Study Notes";
    $("#toc").innerHTML = "";
    const done = problems.filter(p => studied.has(numberOf(p))).length;
    const reviewed = problems.filter(p => p.status === "Reviewed").length;
    const last = store.get("lc-last", null);
    const lastProblem = problems.find(p => p.note_file === last);
    const nextUp = problems.find(p => !studied.has(numberOf(p))) || problems[0];
    const resume = lastProblem || nextUp;
    const cards = topicsInOrder().map(topic => {
      const list = problems.filter(p => p.topic === topic);
      const d = list.filter(p => studied.has(numberOf(p))).length;
      const first = list.find(p => !studied.has(numberOf(p))) || list[0];
      return `<a class="topic-card" href="#/${first.note_file}">
        <h3>${escapeHtml(topic)}</h3><p>${list.length} problems · ${d} studied</p>
        <div class="bar"><span style="width:${(100 * d / list.length).toFixed(1)}%"></span></div></a>`;
    }).join("");
    $("#content").innerHTML = `
      <section class="hero">
        <h1>Study the Top 75 LeetCode problems</h1>
        <p>Every chapter explains the problem in plain words and gives an everyday analogy, a brute-force solution, an optimized Python solution with a line-by-line explanation, a dry run, edge cases, practice questions and a revision card.</p>
      </section>
      <div class="stats">
        <div class="stat"><b>${problems.length}</b><span>problems</span></div>
        <div class="stat"><b>${reviewed}</b><span>notes reviewed and tested</span></div>
        <div class="stat"><b>${done}</b><span>studied by you</span></div>
      </div>
      <a class="cta" href="#/${resume.note_file}">${lastProblem ? "Continue" : "Start"}: ${escapeHtml(cleanTitle(resume.title))} →</a>
      <div class="topics-grid">${cards}</div>`;
    window.scrollTo(0, 0);
  }

  // ---------- Note ----------
  function resolve(fromPath, href) {
    const url = new URL(href, "http://notes.local/" + fromPath);
    return { path: decodeURIComponent(url.pathname.slice(1)), anchor: decodeURIComponent(url.hash.slice(1)) };
  }

  function scrollToAnchor(anchor) {
    const target = anchor && document.getElementById(anchor);
    if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
  }

  async function showNote(path, anchor) {
    const problem = problems.find(p => p.note_file === path);
    if (!problem) { $("#content").innerHTML = `<div class="notice">Note not found: ${escapeHtml(path)}</div>`; return; }
    if (currentPath === path) { scrollToAnchor(anchor); return; }
    currentPath = path;
    store.set("lc-last", path);
    renderSidebar();

    let text;
    try {
      const res = await fetch(path, { cache: "no-cache" });
      if (!res.ok) throw new Error(res.status);
      text = await res.text();
    } catch (err) {
      $("#content").innerHTML = `<div class="notice">Could not load <code>${escapeHtml(path)}</code>. Start the site with <code>start_site.bat</code> (or <code>python -m http.server</code>) instead of opening index.html directly.</div>`;
      return;
    }

    const n = numberOf(problem);
    const index = problems.indexOf(problem);
    const prev = problems[index - 1], next = problems[index + 1];
    const premium = isPremium(problem);
    $("#content").innerHTML = `
      <div class="note-bar">
        <span class="badge">${escapeHtml(problem.topics.join(" · "))}</span>
        ${problem.status === "Reviewed" ? `<span class="badge reviewed">✓ Reviewed &amp; tested</span>` : `<span class="badge">${escapeHtml(problem.status)}</span>`}
        ${premium ? `<span class="badge premium">LeetCode Premium</span>` : ""}
        <button class="study-toggle" id="study-btn"></button>
      </div>
      <article class="md" id="article">${marked.parse(text)}</article>
      <div class="pager">
        ${prev ? `<a class="prev" href="#/${prev.note_file}"><small>← Previous</small>${escapeHtml(cleanTitle(prev.title))}</a>` : "<span></span>"}
        ${next ? `<a class="next" href="#/${next.note_file}"><small>Next →</small>${escapeHtml(cleanTitle(next.title))}</a>` : "<span></span>"}
      </div>`;

    const btn = $("#study-btn");
    const paintBtn = () => { const d = studied.has(n); btn.classList.toggle("done", d); btn.textContent = d ? "✓ Studied" : "Mark as studied"; };
    paintBtn();
    btn.addEventListener("click", () => { toggleStudied(n); paintBtn(); });

    enhanceArticle($("#article"), path);
    document.title = `${n}. ${cleanTitle(problem.title)} · LeetCode Study Notes`;
    scrollToAnchor(anchor);
  }

  function enhanceArticle(article, path) {
    // Heading anchors (GitHub-style ids, so links like note.md#9-concepts... work)
    const seen = {};
    $$("h1, h2, h3, h4", article).forEach(h => {
      let id = slug(h.textContent);
      if (seen[id] !== undefined) id = `${id}-${++seen[id]}`; else seen[id] = 0;
      h.id = id;
    });

    // Links: other notes → in-app routes; same-page anchors → smooth scroll; web → new tab
    $$("a[href]", article).forEach(a => {
      const href = a.getAttribute("href");
      if (/^https?:/i.test(href)) { a.target = "_blank"; a.rel = "noopener"; return; }
      if (href.startsWith("#")) {
        a.addEventListener("click", e => { e.preventDefault(); scrollToAnchor(decodeURIComponent(href.slice(1))); });
        return;
      }
      if (/\.md(#|$)/.test(href)) {
        const { path: target, anchor } = resolve(path, href);
        a.setAttribute("href", `#/${target}${anchor ? "#" + anchor : ""}`);
      }
    });

    // Wide tables scroll horizontally on small screens
    $$("table", article).forEach(t => { const w = document.createElement("div"); w.className = "table-wrap"; t.replaceWith(w); w.appendChild(t); });

    // Code highlighting + copy buttons
    $$("pre code", article).forEach(code => {
      if (window.hljs && code.className.includes("language-")) { try { hljs.highlightElement(code); } catch { /* unknown language */ } }
      const b = document.createElement("button");
      b.className = "copy-btn"; b.type = "button"; b.textContent = "Copy";
      b.addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(code.textContent); b.textContent = "Copied!"; }
        catch { b.textContent = "Select & copy"; }
        setTimeout(() => (b.textContent = "Copy"), 1500);
      });
      code.parentElement.appendChild(b);
    });

    // Table of contents for the 14 sections
    const sections = $$("h2", article);
    $("#toc").innerHTML = sections.length
      ? `<div class="toc-title">On this page</div>` + sections.map(h => `<a href="#" data-id="${h.id}">${escapeHtml(h.textContent)}</a>`).join("")
      : "";
    $$("#toc a").forEach(a => a.addEventListener("click", e => { e.preventDefault(); scrollToAnchor(a.dataset.id); }));
    tocObserver?.disconnect();
    tocObserver = new IntersectionObserver(entries => {
      for (const entry of entries) if (entry.isIntersecting) {
        $$("#toc a").forEach(a => a.classList.toggle("current", a.dataset.id === entry.target.id));
      }
    }, { rootMargin: "-70px 0px -70% 0px" });
    sections.forEach(h => tocObserver.observe(h));
  }
  let tocObserver = null;

  // ---------- Router ----------
  function route() {
    const raw = location.hash.replace(/^#\/?/, "");
    if (!raw) return showHome();
    const cut = raw.indexOf("#");
    const path = decodeURIComponent(cut === -1 ? raw : raw.slice(0, cut));
    const anchor = cut === -1 ? "" : decodeURIComponent(raw.slice(cut + 1));
    showNote(path, anchor);
  }

  async function init() {
    if (!window.marked) {
      $("#content").innerHTML = `<div class="notice">The Markdown renderer could not load from the CDN. Check your internet connection and reload.</div>`;
      return;
    }
    marked.setOptions({ gfm: true });
    try {
      const res = await fetch("problems_manifest.json", { cache: "no-cache" });
      problems = await res.json();
    } catch {
      $("#content").innerHTML = `<div class="notice">Could not load <code>problems_manifest.json</code>. Start the site with <code>start_site.bat</code> (or run <code>python -m http.server</code> in the LeetCode_Notes folder) and open the link it prints. Opening index.html directly from disk does not work because browsers block file reads.</div>`;
      return;
    }
    updateProgress();
    renderSidebar();
    window.addEventListener("hashchange", route);
    route();
  }
  init();
})();
</script>
</body>
</html>
