<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Beginner-friendly Python study notes for the Top 75 LeetCode problems, organised by topic.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0e0b16">
<title>Python LeetCode Notes</title>
<style>
:root {
  --bg: #0e0b16;
  --bg-2: #141020;
  --surface: #1a1528;
  --surface-2: #221c34;
  --surface-3: #2b2442;
  --border: #322a4a;
  --border-strong: #463b66;
  --text: #ece9f5;
  --text-2: #c4bdd8;
  --muted: #9890b0;
  --accent: #a78bfa;
  --accent-strong: #8b5cf6;
  --accent-soft: rgba(139, 92, 246, .16);
  --accent-glow: rgba(139, 92, 246, .35);
  --good: #4ade80;
  --good-soft: rgba(74, 222, 128, .12);
  --warn: #fbbf24;
  --warn-soft: rgba(251, 191, 36, .12);
  --radius: 14px;
  --radius-sm: 9px;
  --sidebar-w: 272px;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.25);
  --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, "Liberation Mono", monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  min-height: 100vh;
}
a { color: var(--accent); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip-link { position: absolute; left: 12px; top: -48px; z-index: 100; background: var(--accent-strong); color: #fff; padding: 8px 14px; border-radius: 8px; text-decoration: none; font-weight: 600; }
.skip-link:focus { top: 12px; }

/* ---------- Layout ---------- */
.layout { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 100vh; }

/* ---------- Sidebar ---------- */
.sidebar {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--bg-2); border-right: 1px solid var(--border);
  padding: 20px 14px 28px; display: flex; flex-direction: column; gap: 22px;
}
.brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px; color: var(--text); text-decoration: none; }
.brand-logo {
  width: 36px; height: 36px; border-radius: 10px; flex: none;
  display: grid; place-items: center; font: 700 15px/1 var(--mono); color: #fff;
  background: linear-gradient(135deg, #a78bfa, #7c3aed);
  box-shadow: 0 4px 14px var(--accent-glow);
}
.brand-name { font-weight: 700; font-size: 16px; line-height: 1.2; }
.brand-name small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
.nav-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 10px 8px; margin: 0; }
.nav-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.nav-link {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm);
  color: var(--text-2); text-decoration: none; font-size: 14.5px; line-height: 1.3;
  transition: background .15s, color .15s;
}
.nav-link:hover { background: var(--surface); color: var(--text); }
.nav-link[aria-current="page"] { background: var(--accent-soft); color: #fff; font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
.nav-icon {
  width: 26px; height: 26px; border-radius: 7px; flex: none; display: grid; place-items: center;
  background: var(--surface-2); color: var(--accent); font: 600 11px/1 var(--mono);
}
.nav-icon.sym { font: 16px/1 "Segoe UI Symbol", "Apple Symbols", "Noto Sans Symbols 2", sans-serif; }
.nav-link[aria-current="page"] .nav-icon { background: var(--accent-strong); color: #fff; }
.nav-count { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sidebar-foot { margin-top: auto; padding: 14px 10px 0; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted); }
.sidebar-foot a { color: var(--text-2); }

/* ---------- Mobile top bar ---------- */
.topbar { display: none; }
.menu-btn {
  width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); cursor: pointer; display: grid; place-items: center;
}
.menu-btn svg { width: 20px; height: 20px; }
.scrim { display: none; }

/* ---------- Main ---------- */
main { min-width: 0; padding: 40px 48px 80px; }
main:focus { outline: none; }
.content-col { min-width: 0; }
.container { max-width: 1080px; margin: 0 auto; }

/* Hero */
.hero {
  position: relative; overflow: hidden; border-radius: 20px; padding: 44px 44px 40px;
  background:
    radial-gradient(600px 260px at 85% -10%, rgba(139,92,246,.35), transparent 70%),
    radial-gradient(400px 220px at 0% 110%, rgba(167,139,250,.14), transparent 70%),
    var(--surface);
  border: 1px solid var(--border);
}
.eyebrow {
  display: inline-flex; align-items: center; gap: 8px; margin: 0 0 14px; padding: 4px 12px;
  border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 600;
}
.hero h1 { font-size: clamp(28px, 4.2vw, 42px); line-height: 1.15; letter-spacing: -.02em; margin: 0 0 14px; max-width: 760px; }
.hero h1 span { background: linear-gradient(90deg, #c4b5fd, #8b5cf6); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { color: var(--text-2); font-size: 17px; margin: 0; max-width: 640px; }
.stats { display: flex; flex-wrap: wrap; gap: 12px 28px; margin: 26px 0 0; padding: 0; list-style: none; }
.stats li { color: var(--muted); font-size: 14px; }
.stats b { display: block; color: var(--text); font-size: 26px; line-height: 1.2; font-variant-numeric: tabular-nums; }

/* Search */
.search-wrap { position: relative; margin-top: 28px; max-width: 620px; }
.search-wrap svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search {
  width: 100%; height: 52px; padding: 0 92px 0 46px; border-radius: 12px;
  border: 1px solid var(--border-strong); background: var(--bg-2); color: var(--text); font-size: 16px;
  transition: border-color .15s, box-shadow .15s;
}
.search::placeholder { color: var(--muted); }
.search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.kbd {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  font: 12px var(--mono); color: var(--muted); border: 1px solid var(--border-strong); border-radius: 6px; padding: 2px 7px;
}

/* Sections */
.section { margin-top: 48px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.section-head h2 { font-size: 22px; letter-spacing: -.01em; margin: 0; }
.section-head p { margin: 0; color: var(--muted); font-size: 14px; }

/* Topic cards */
.topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; list-style: none; margin: 0; padding: 0; }
.topic-card {
  display: flex; flex-direction: column; gap: 10px; height: 100%; padding: 18px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--text); text-decoration: none; transition: transform .15s, border-color .15s, box-shadow .15s;
}
.topic-card:hover { transform: translateY(-2px); border-color: var(--accent-strong); box-shadow: 0 10px 30px rgba(139,92,246,.14); }
.topic-card-top { display: flex; align-items: center; justify-content: space-between; }
.topic-card .nav-icon { width: 38px; height: 38px; border-radius: 10px; font-size: 13px; background: var(--accent-soft); }
.topic-card h3 { margin: 0; font-size: 17px; }
.topic-card p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.5; flex: 1; }
.pill { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }

/* Problem list */
.problem-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.problem-list li + li { border-top: 1px solid var(--border); }
.problem {
  display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; align-items: center; gap: 14px;
  padding: 14px 18px; color: var(--text); text-decoration: none; transition: background .12s;
}
.problem:hover { background: var(--surface-2); }
.problem-num { font: 600 13px var(--mono); color: var(--muted); }
.problem-title { font-weight: 600; font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; }
.problem-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
.tag { font-size: 12px; color: var(--text-2); background: var(--surface-2); border-radius: 6px; padding: 1px 8px; }
.problem .arrow { color: var(--muted); font-size: 18px; transition: transform .15s, color .15s; }
.problem:hover .arrow { transform: translateX(3px); color: var(--accent); }
.list-status { color: var(--muted); font-size: 14px; margin: 0 0 12px; min-height: 1.6em; }
.empty { padding: 34px 20px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--border-strong); border-radius: var(--radius); }
.empty strong { color: var(--text); display: block; margin-bottom: 4px; font-size: 16px; }

/* Topic / placeholder pages */
.crumbs { font-size: 14px; color: var(--muted); margin-bottom: 18px; }
.crumbs a { color: var(--text-2); text-decoration: none; }
.crumbs a:hover { color: var(--accent); text-decoration: underline; }
.page-head { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
.page-head .nav-icon { width: 52px; height: 52px; border-radius: 14px; font-size: 16px; background: var(--accent-soft); }
.page-head h1 { margin: 0; font-size: clamp(26px, 3.4vw, 34px); letter-spacing: -.02em; line-height: 1.15; }
.lead { color: var(--text-2); font-size: 17px; max-width: 680px; margin: 10px 0 0; }

.notice {
  display: flex; gap: 16px; align-items: flex-start; padding: 22px 24px; margin-top: 28px;
  border-radius: var(--radius); border: 1px solid rgba(251,191,36,.35); background: var(--warn-soft);
}
.notice-icon { flex: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: rgba(251,191,36,.18); color: var(--warn); font-weight: 700; }
.notice h2 { margin: 0 0 6px; font-size: 18px; color: var(--warn); }
.notice p { margin: 0 0 8px; color: var(--text-2); }
.notice p:last-child { margin-bottom: 0; }
.notice code { font: .9em var(--mono); background: var(--surface-2); padding: 1px 6px; border-radius: 5px; color: var(--text); overflow-wrap: anywhere; }

.detail-card { margin-top: 24px; padding: 22px 24px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.detail-card dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 10px 22px; margin: 0; }
.detail-card dt { color: var(--muted); font-size: 14px; }
.detail-card dd { margin: 0; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 18px; border-radius: 10px;
  font-weight: 600; font-size: 14.5px; text-decoration: none; border: 1px solid var(--border-strong);
  background: var(--surface-2); color: var(--text); cursor: pointer; transition: background .15s, border-color .15s;
}
.btn:hover { border-color: var(--accent); background: var(--surface-3); }
.btn.primary { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
.btn.primary:hover { background: #7c3aed; }

.loading { color: var(--muted); padding: 40px 0; }
footer.site-foot { margin-top: 64px; padding-top: 22px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; }

/* ---------- Responsive ---------- */
@media (max-width: 960px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .topbar {
    display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 30;
    padding: 10px 16px; background: rgba(14, 11, 22, .88); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .topbar .brand { padding: 0; }
  .topbar .brand-logo { width: 32px; height: 32px; font-size: 13px; }
  .sidebar {
    position: fixed; left: 0; top: 0; z-index: 50; width: min(86vw, 300px); height: 100vh; height: 100dvh;
    transform: translateX(-100%); transition: transform .22s ease; visibility: hidden;
    box-shadow: 12px 0 40px rgba(0,0,0,.5);
  }
  body.nav-open .sidebar { transform: none; visibility: visible; }
  body.nav-open .scrim { display: block; position: fixed; inset: 0; z-index: 40; background: rgba(5, 3, 10, .6); }
  body.nav-open { overflow: hidden; }
  main { padding: 24px 16px 60px; }
  .hero { padding: 28px 20px 26px; border-radius: 16px; }
  .hero p { font-size: 16px; }
}
@media (max-width: 560px) {
  .problem { grid-template-columns: 38px minmax(0, 1fr) auto; gap: 10px; padding: 13px 14px; }
  .problem .pill { display: none; }
  .kbd { display: none; }
  .search { padding-right: 16px; }
  .detail-card dl { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .detail-card dd { margin-bottom: 10px; }
  .notice { flex-direction: column; padding: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="Site navigation">
    <a class="brand" href="#/">
      <span class="brand-logo" aria-hidden="true">Py</span>
      <span class="brand-name">LeetCode Notes<small>Python · Top 75</small></span>
    </a>
    <nav aria-label="Main">
      <ul class="nav-list">
        <li><a class="nav-link" href="#/" data-route="home"><span class="nav-icon sym" aria-hidden="true">⌂</span>Home<span class="nav-count" id="nav-total"></span></a></li>
      </ul>
    </nav>
    <nav aria-labelledby="topics-label">
      <p class="nav-label" id="topics-label">Topics</p>
      <ul class="nav-list" id="topic-nav"></ul>
    </nav>
    <div class="sidebar-foot">
      Notes are written in Markdown in the <code>LeetCode_Notes</code> folder.
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="content-col">
    <div class="topbar">
      <button class="menu-btn" id="menu-btn" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a class="brand" href="#/">
        <span class="brand-logo" aria-hidden="true">Py</span>
        <span class="brand-name">LeetCode Notes</span>
      </a>
    </div>
    <main id="main" tabindex="-1">
      <div class="container" id="view"><p class="loading">Loading problems…</p></div>
    </main>
  </div>
</div>

<script>
(() => {
  "use strict";

  // Problem data comes from the existing manifest; nothing is hard-coded here.
  const MANIFEST_URL = "LeetCode_Notes/problems_manifest.json";

  // Topic order and short beginner descriptions (the problems themselves come from the manifest).
  const TOPICS = [
    { name: "Array", slug: "array", icon: "[ ]", blurb: "Ordered lists of values. Learn hash maps, two pointers, prefix products and binary search." },
    { name: "Binary", slug: "binary", icon: "01", blurb: "Work directly with bits using AND, OR, XOR and shifts." },
    { name: "Interval", slug: "interval", icon: "↔", blurb: "Ranges with a start and an end. Sort them, then merge or compare neighbours." },
    { name: "Linked List", slug: "linked-list", icon: "→", blurb: "Chains of nodes. Practise moving pointers, dummy heads and fast/slow runners." },
    { name: "Matrix", slug: "matrix", icon: "▦", blurb: "2D grids. Walk them row by row, layer by layer, or with depth-first search." },
    { name: "String", slug: "string", icon: "\"a\"", blurb: "Text problems. Sliding windows, character counts and palindromes." },
    { name: "Tree", slug: "tree", icon: "⋔", blurb: "Hierarchies of nodes. Recursion, DFS/BFS, binary search trees and tries." },
    { name: "Dynamic Programming", slug: "dynamic-programming", icon: "dp", blurb: "Split a problem into smaller overlapping ones and reuse their answers." },
    { name: "Graph", slug: "graph", icon: "◇", blurb: "Nodes joined by edges. Explore with BFS, DFS, union-find and topological sort." },
    { name: "Heap", slug: "heap", icon: "△", blurb: "Priority queues that keep the smallest or largest item ready to use." },
  ];

  const $ = (sel, el = document) => el.querySelector(sel);
  const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
  const view = $("#view");
  const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  let problems = [];
  let homeQuery = "";

  const numberOf = p => p.note_file.split("/").pop().slice(0, 3);
  const isPremium = p => /premium/i.test(p.title);
  const cleanTitle = t => t.replace(/\s*\(Leetcode Premium\)/i, "");
  const topicBySlug = slug => TOPICS.find(t => t.slug === slug);
  const topicByName = name => TOPICS.find(t => t.name === name);
  const problemsIn = topic => problems.filter(p => (p.topics || [p.topic]).includes(topic.name));
  const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
  const iconHtml = t => `<span class="nav-icon${[...t.icon].length === 1 ? " sym" : ""}" aria-hidden="true">${escapeHtml(t.icon)}</span>`;

  // ---------- Rendering helpers ----------
  function statusPill(p) {
    if (p.status === "Reviewed") return `<span class="pill good" title="Written in full and code-tested">Reviewed</span>`;
    return `<span class="pill warn">${escapeHtml(p.status || "In progress")}</span>`;
  }

  function problemRow(p) {
    const tags = (p.topics || [p.topic]).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("");
    const premium = isPremium(p) ? `<span class="tag">LeetCode Premium</span>` : "";
    return `<li><a class="problem" href="#/problem/${numberOf(p)}">
      <span class="problem-num">${numberOf(p)}</span>
      <span><span class="problem-title">${escapeHtml(cleanTitle(p.title))}</span>
        <span class="problem-meta">${tags}${premium}</span></span>
      <span style="display:flex;align-items:center;gap:12px">${statusPill(p)}<span class="arrow" aria-hidden="true">›</span></span>
    </a></li>`;
  }

  function problemList(list, emptyHtml) {
    return list.length ? `<ul class="problem-list">${list.map(problemRow).join("")}</ul>` : `<div class="empty">${emptyHtml}</div>`;
  }

  function topicCard(t) {
    const count = problemsIn(t).length;
    const pill = count ? `<span class="pill accent">${plural(count, "problem")}</span>` : `<span class="pill warn">Not started</span>`;
    return `<li><a class="topic-card" href="#/topic/${t.slug}">
      <span class="topic-card-top">${iconHtml(t)}${pill}</span>
      <h3>${escapeHtml(t.name)}</h3>
      <p>${escapeHtml(t.blurb)}</p>
    </a></li>`;
  }

  function renderSidebar() {
    $("#nav-total").textContent = problems.length || "";
    $("#topic-nav").innerHTML = TOPICS.map(t => `<li><a class="nav-link" href="#/topic/${t.slug}" data-route="topic/${t.slug}">
      ${iconHtml(t)}${escapeHtml(t.name)}
      <span class="nav-count">${problems.length ? problemsIn(t).length : ""}</span></a></li>`).join("");
  }

  function markCurrent(route) {
    $$(".nav-link").forEach(a => {
      if (a.dataset.route === route) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
  }

  // ---------- Views ----------
  function matches(p, q) {
    const hay = [p.title, numberOf(p), ...(p.topics || [p.topic])].join(" ").toLowerCase();
    return q.split(/\s+/).every(word => hay.includes(word));
  }

  function renderHomeList() {
    const q = homeQuery.trim().toLowerCase();
    const list = q ? problems.filter(p => matches(p, q)) : problems;
    $("#home-results").innerHTML = problemList(list,
      `<strong>No problems match “${escapeHtml(homeQuery.trim())}”</strong>Try a shorter word, a topic name like “tree”, or a number like “042”.`);
    $("#list-status").textContent = q
      ? `${plural(list.length, "problem")} match “${homeQuery.trim()}”`
      : `Showing all ${problems.length} problems in study order`;
  }

  function showHome() {
    const reviewed = problems.filter(p => p.status === "Reviewed").length;
    const premium = problems.filter(isPremium).length;
    document.title = "Python LeetCode Notes";
    view.innerHTML = `
      <section class="hero" aria-labelledby="hero-title">
        <p class="eyebrow">Beginner-friendly · Python</p>
        <h1 id="hero-title">Learn the <span>Top 75 LeetCode problems</span> one clear step at a time</h1>
        <p>Each problem gets a plain-English explanation, an everyday analogy, a brute-force solution, an optimized Python solution, a dry run, edge cases and a revision checklist.</p>
        <ul class="stats">
          <li><b>${problems.length}</b>problems</li>
          <li><b>${TOPICS.length}</b>topics</li>
          <li><b>${reviewed}</b>notes reviewed &amp; tested</li>
          ${premium ? `<li><b>${premium}</b>LeetCode Premium</li>` : ""}
        </ul>
        <div class="search-wrap" role="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <label class="sr-only" for="home-search">Search problems by name, topic or number</label>
          <input class="search" id="home-search" type="search" placeholder="Search problems, e.g. “two sum” or “tree”" autocomplete="off" aria-controls="home-results" value="${escapeHtml(homeQuery)}">
          <span class="kbd" aria-hidden="true">/</span>
        </div>
      </section>

      <section class="section" aria-labelledby="topics-title">
        <div class="section-head"><h2 id="topics-title">Browse by topic</h2><p>Start with Array if you are new, then go in order.</p></div>
        <ul class="topic-grid">${TOPICS.map(topicCard).join("")}</ul>
      </section>

      <section class="section" aria-labelledby="problems-title">
        <div class="section-head"><h2 id="problems-title">All problems</h2></div>
        <p class="list-status" id="list-status" role="status" aria-live="polite"></p>
        <div id="home-results"></div>
      </section>
      ${footer()}`;
    const input = $("#home-search");
    input.addEventListener("input", () => { homeQuery = input.value; renderHomeList(); });
    renderHomeList();
  }

  function showTopic(topic) {
    const list = problemsIn(topic);
    document.title = `${topic.name} · Python LeetCode Notes`;
    const shared = list.filter(p => p.topic !== topic.name);
    const sharedNote = shared.length
      ? `<p class="lead" style="font-size:14px;color:var(--muted)">${shared.map(p => `“${escapeHtml(cleanTitle(p.title))}”`).join(", ")} also belongs to ${escapeHtml([...new Set(shared.map(p => p.topic))].join(", "))}, so it appears in both lists.</p>`
      : "";
    view.innerHTML = `
      <nav class="crumbs" aria-label="Breadcrumb"><a href="#/">Home</a> / ${escapeHtml(topic.name)}</nav>
      <div class="page-head">${iconHtml(topic)}<h1>${escapeHtml(topic.name)}</h1></div>
      <p class="lead">${escapeHtml(topic.blurb)}</p>
      ${sharedNote}
      <section class="section" aria-labelledby="topic-problems-title" style="margin-top:32px">
        <div class="section-head"><h2 id="topic-problems-title">Problems</h2><p>${plural(list.length, "problem")}</p></div>
        ${problemList(list, `<strong>No notes for ${escapeHtml(topic.name)} yet</strong>Problems for this topic have not been written. They will appear here once they are added to the manifest.`)}
      </section>
      ${footer()}`;
  }

  function showProblem(num) {
    const p = problems.find(x => numberOf(x) === num);
    if (!p) return showNotFound(`There is no problem numbered “${num}” in the manifest.`);
    const topic = topicByName(p.topic);
    document.title = `${num}. ${cleanTitle(p.title)} · Python LeetCode Notes`;
    view.innerHTML = `
      <nav class="crumbs" aria-label="Breadcrumb"><a href="#/">Home</a> / ${topic ? `<a href="#/topic/${topic.slug}">${escapeHtml(topic.name)}</a>` : escapeHtml(p.topic)} / ${escapeHtml(num)}</nav>
      <div class="page-head"><span class="nav-icon" aria-hidden="true">${escapeHtml(num)}</span><h1>${escapeHtml(cleanTitle(p.title))}</h1></div>

      <div class="notice" role="note">
        <span class="notice-icon" aria-hidden="true">!</span>
        <div>
          <h2>This page is not built yet</h2>
          <p>The study note for this problem exists, but showing it inside this website is the next milestone. For now this page only lists the note's details.</p>
          <p>Note file: <code>LeetCode_Notes/${escapeHtml(p.note_file)}</code></p>
        </div>
      </div>

      <div class="detail-card">
        <dl>
          <dt>Topic${(p.topics || []).length > 1 ? "s" : ""}</dt><dd>${escapeHtml((p.topics || [p.topic]).join(", "))}</dd>
          <dt>Note status</dt><dd>${statusPill(p)}</dd>
          ${p.review_note ? `<dt>Review notes</dt><dd>${escapeHtml(p.review_note)}</dd>` : ""}
          ${isPremium(p) ? `<dt>Access</dt><dd>LeetCode Premium problem</dd>` : ""}
        </dl>
        <div class="actions">
          ${topic ? `<a class="btn primary" href="#/topic/${topic.slug}">← Back to ${escapeHtml(topic.name)}</a>` : ""}
          ${p.url ? `<a class="btn" href="${escapeHtml(p.url)}" target="_blank" rel="noopener">Open on LeetCode ↗</a>` : ""}
        </div>
      </div>
      ${footer()}`;
  }

  function showNotFound(message) {
    document.title = "Page not found · Python LeetCode Notes";
    view.innerHTML = `
      <nav class="crumbs" aria-label="Breadcrumb"><a href="#/">Home</a></nav>
      <div class="notice" role="note">
        <span class="notice-icon" aria-hidden="true">?</span>
        <div>
          <h2>Page not found</h2>
          <p>${escapeHtml(message)}</p>
          <p><a href="#/">Go back to the homepage</a></p>
        </div>
      </div>`;
  }

  function showLoadError() {
    view.innerHTML = `
      <div class="notice" role="alert">
        <span class="notice-icon" aria-hidden="true">!</span>
        <div>
          <h2>Could not load the problem list</h2>
          <p>The site reads <code>${MANIFEST_URL}</code>, and browsers block that when <code>index.html</code> is opened straight from disk.</p>
          <p>Start a local server from the <code>Notes</code> folder with <code>python -m http.server 8000</code>, then open <a href="http://localhost:8000/">http://localhost:8000/</a>.</p>
        </div>
      </div>`;
  }

  function footer() {
    return `<footer class="site-foot">Python LeetCode study notes · Problem list from <code>problems_manifest.json</code></footer>`;
  }

  // ---------- Router ----------
  function route() {
    const path = decodeURIComponent(location.hash.replace(/^#\/?/, "")).replace(/\/+$/, "");
    const [section, id] = path.split("/");
    closeNav();

    if (!path) { markCurrent("home"); showHome(); }
    else if (section === "topic" && topicBySlug(id)) { markCurrent(`topic/${id}`); showTopic(topicBySlug(id)); }
    else if (section === "problem" && id) {
      const p = problems.find(x => numberOf(x) === id);
      const t = p && topicByName(p.topic);
      markCurrent(t ? `topic/${t.slug}` : "");
      showProblem(id);
    }
    else { markCurrent(""); showNotFound("This page does not exist yet."); }

    window.scrollTo(0, 0);
    if (path) $("#main").focus({ preventScroll: true });
  }

  // ---------- Mobile navigation ----------
  const menuBtn = $("#menu-btn");
  function openNav() {
    document.body.classList.add("nav-open");
    menuBtn.setAttribute("aria-expanded", "true");
    menuBtn.setAttribute("aria-label", "Close navigation");
    $("#sidebar .nav-link")?.focus();
  }
  function closeNav() {
    if (!document.body.classList.contains("nav-open")) return;
    document.body.classList.remove("nav-open");
    menuBtn.setAttribute("aria-expanded", "false");
    menuBtn.setAttribute("aria-label", "Open navigation");
  }
  menuBtn.addEventListener("click", () => document.body.classList.contains("nav-open") ? (closeNav(), menuBtn.focus()) : openNav());
  $("#scrim").addEventListener("click", closeNav);
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && document.body.classList.contains("nav-open")) { closeNav(); menuBtn.focus(); }
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
    if (e.key === "/" && !typing && !e.ctrlKey && !e.metaKey) {
      const search = $("#home-search");
      if (search) { e.preventDefault(); search.focus(); }
      else { e.preventDefault(); location.hash = "#/"; requestAnimationFrame(() => $("#home-search")?.focus()); }
    }
  });

  // ---------- Start ----------
  async function init() {
    renderSidebar();
    try {
      const res = await fetch(MANIFEST_URL, { cache: "no-cache" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error("Manifest is not a list");
      problems = data.filter(p => p && p.title && p.note_file);
    } catch (err) {
      console.error("Failed to load manifest:", err);
      markCurrent("");
      showLoadError();
      return;
    }
    renderSidebar();
    window.addEventListener("hashchange", route);
    route();
  }
  init();
})();
</script>
</body>
</html>
